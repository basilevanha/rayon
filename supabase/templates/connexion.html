<h2>Votre connexion à Rayon</h2>
<p>Pour vous connecter, touchez ce lien :</p>
<p><a href="{{ .ConfirmationURL }}">Se connecter à Rayon</a></p>
<p>Ou saisissez ce code dans l'application :</p>
